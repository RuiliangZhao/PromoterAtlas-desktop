[package]
name = "promoter-atlas-desktop"
version = "0.7.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
custom-protocol = ["tauri/custom-protocol"]
